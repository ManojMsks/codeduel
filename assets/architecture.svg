<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="CodeDuel architecture diagram">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333" />
    </marker>
    <style>
      .box { fill:#f7f9fb; stroke:#2b6cb0; stroke-width:2; rx:6; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size:14px; fill:#0b2545; }
      .small { font-size:12px; fill:#334155; }
      .arrow { stroke:#1f2937; stroke-width:2; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>

  <!-- Frontend -->
  <rect x="30" y="30" width="220" height="80" class="box"/>
  <text x="140" y="58" text-anchor="middle" class="label">User browser</text>
  <text x="140" y="78" text-anchor="middle" class="small">React SPA (Vite)</text>

  <!-- Backend API -->
  <rect x="350" y="20" width="220" height="80" class="box"/>
  <text x="460" y="48" text-anchor="middle" class="label">Backend API</text>
  <text x="460" y="68" text-anchor="middle" class="small">Node.js / Express-style</text>

  <!-- Backend Socket -->
  <rect x="350" y="130" width="220" height="80" class="box"/>
  <text x="460" y="158" text-anchor="middle" class="label">Socket Server</text>
  <text x="460" y="178" text-anchor="middle" class="small">Realtime updates (socket.io)</text>

  <!-- Database -->
  <rect x="680" y="70" width="200" height="80" class="box"/>
  <text x="780" y="98" text-anchor="middle" class="label">Database</text>
  <text x="780" y="118" text-anchor="middle" class="small">MongoDB / persistent store</text>

  <!-- Arrows -->
  <path d="M250,70 L350,70" class="arrow" />
  <path d="M460,100 L780,100" class="arrow" />
  <path d="M460,110 L460,130" class="arrow" />
  <path d="M460,170 L460,200" class="arrow" />
  <path d="M250,70 L350,170" class="arrow" />
  <path d="M350,170 L250,70" stroke="#1f2937" stroke-width="1" fill="none" opacity="0" />

  <!-- Labels on arrows -->
  <text x="310" y="58" text-anchor="middle" class="small">HTTP</text>
  <text x="570" y="92" text-anchor="middle" class="small">reads/writes</text>
  <text x="415" y="150" text-anchor="end" class="small">push events</text>
  <text x="305" y="150" text-anchor="start" class="small">Socket.io</text>

  <!-- Group labels -->
  <rect x="320" y="8" width="580" height="234" rx="8" ry="8" fill="none" stroke="#cbd5e1" stroke-dasharray="6 4" />
  <text x="330" y="24" class="small">Backend</text>
</svg>
